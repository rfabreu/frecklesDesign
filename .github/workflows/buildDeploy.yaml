name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Unit Tests
        run: npm test -- --watchAll=false

      - name: Build Application
        run: npm run build

      - name: Verify CNAME and SEO/GEO Assets Preservation
        run: |
          for file in CNAME sitemap.xml robots.txt llms.txt llms-full.txt; do
            if [ ! -f "build/$file" ]; then
              echo "Error: build/$file does not exist. Aborting to protect site integrity."
              exit 1
            fi
          done
          echo "All required domain, SEO, and LLM assets verified in build folder."

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          clean: true
